name: 频道源自动更新
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # UTC22:00 → 北京时间次日06:00
  push:
    branches: [ main ]

jobs:
  run_fetch:
    runs-on: ubuntu‑latest
    env:
      PYTHONIOENCODING: utf‑8
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup‑python@v5
        with:
          python‑version: "3.11"

      - name: 安装依赖 requests
        run: pip install requests

      - name: 执行抓取脚本 fetch_live2.py
        run: python3 fetch_live2.py

      - name: 提交并推送 qdyd.nzk【强制提交】
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add qdyd.nzk
          git status
          git commit --allow-empty -m "auto update qdyd.nzk $(date +'%Y‑%m‑%d %H:%M')"
          git push

