name: 每日更新qdyd.nzk
on:
  schedule:
    # cron UTC时间！UTC+0，北京时间=UTC+8
    # 每天北京时间 02:00 执行 → UTC 18:00
    - cron: '0 18 * * *'
  # 可选：支持手动点按钮立即运行
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖requests
        run: pip install requests

      - name: 执行脚本
        run: python fetch_live2.py

      - name: 提交更新文件
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add qdyd.nzk
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 自动更新 qdyd.nzk $(date '+%Y‑%m‑%d')"
          git push
