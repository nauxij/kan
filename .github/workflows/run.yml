name: 每日更新qdyd.txt
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装requests
        run: pip install requests

      - name: 读取远程txt并排序
        run: python fetch_live2.py

      - name: 强制提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qdyd.txt
          git commit -m "🤖自动更新 qdyd.txt $(date '+%Y-%m-%d')"
          git push
