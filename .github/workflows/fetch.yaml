name: Fetch Live Source
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # 改为冷门时间 UTC 17:15 = 北京时间 次日 01:15
    - cron: '15 17 * * *'
  push:
    branches: [ main ]

jobs:
  run_fetch:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖 requests
        run: pip install requests

      - name: 执行抓取脚本 fetch_live2.py
        run: python3 fetch_live2.py

      - name: 提交并推送 qdyd.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qdyd.txt
          git status
          git commit --allow-empty -m "auto update qdyd.txt $(date +'%Y-%m-%d %H:%M')"
          git push --force-with-lease

