name: Fetch Live Source
on:
  workflow_dispatch:  # 支持手动点击运行
  schedule:
    - cron: '0 20 * * *'  # UTC20:00 → 北京时间次日04:00
  push:
    branches: [ main ]

jobs:
  run_fetch:
    runs-on: ubuntu‑latest
    env:
      PYTHONIOENCODING: utf‑8  # 防止中文台名乱码
    permissions:
      contents: write  # 必须开启，允许bot提交推送文件
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup‑python@v5
        with:
          python‑version: "3.11"

      - name: 安装依赖 requests
        run: pip install requests

      - name: 执行抓取脚本 fetch_live2.py
        run: python3 fetch_live2.py

      - name: 提交并推送 qdyd.txt（强制提交）
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add qdyd.txt
          git status
          # --allow-empty：即使文件没有改动，也强制生成提交
          git commit --allow-empty -m "auto update qdyd.txt $(date +'%Y‑%m‑%d %H:%M')"
          git push
