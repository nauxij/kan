name: Generate qdyd.txt
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须开启写权限，否则无法推送
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run generate script
        run: python3 gen.py

      - name: Commit & push
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add qdyd.txt
          git status
          # 有变更就提交推送，无变更直接跳过不报错
          if [[ -n $(git status --porcelain) ]]; then
              git commit -m "auto update qdyd.txt"
              git push
          else
              echo "文件无更新，跳过提交"
          fi

