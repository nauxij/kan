name: fetch2
on:
  workflow_dispatch:    # 注意！往前退一格，和schedule对齐
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  run-fetch2:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖 requests
        run: pip install requests

      - name: 执行抓取脚本 fetch_live2.py
        run: python fetch_live2.py

      - name: 提交更新 qdyd.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qdyd.txt
          git commit -m "auto update $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push

